name: Build Android APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./android/gradlew

      - name: Build Android APKs (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Stage Artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Pianotes-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Pianotes-debug.apk
          ls -lh *.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pianotes-Android-APKs
          path: |
            Pianotes-release.apk
            Pianotes-debug.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Pianotes-release.apk
            Pianotes-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
